---
site_name: pyreostream
site_description: Bridge a Reolink camera's encoded video stream to RTSP/RTP and its motion state to MQTT
repo_url: https://github.com/erwindouna/pyreostream
repo_name: erwindouna/pyreostream

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - API reference: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
